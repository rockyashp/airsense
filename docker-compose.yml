services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airsense-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - CORS_ORIGINS=*
      - AIRSENSE_MODEL_API_KEY=${AIRSENSE_MODEL_API_KEY:-}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: airsense-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - AIRSENSE_API_URL=http://backend:8000
    depends_on:
      - backend
